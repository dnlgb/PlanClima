<!DOCTYPE html>

<body>

        <h2>Elige una ciudad</h2>

        <label for="planes">Selecciona un plan: </label>
        <select id="planes">
            <option value="Playa">Playa</option>
            <option value="Caminar">Caminar</option>
            <option value="Picnic">Picnic</option>
            <option value="Cicla">Cicla</option>
            <option value="Familiar">Familiar</option>
        </select>

            <button id="buscar">Buscar</button>
    </main>
    <section class="contenedor-resultados">

        <div class="Ciudad-resultado">
            <h3>Resultado</h3>
            <p>Ciudad:</p>
        </div>
    
        <div class="pronostico">
            <h3>Pronóstico</h3>
            <p>Score:</p>
            <p>Recomendaciones:</p>
        </div>
    
    </section>


</body>
</html>
